name: Quality checks
on:
  pull_request:
  push:
    branches-ignore: [main]
permissions:
  contents: read
jobs:
  windows-files:
    uses: ./.github/workflows/windows-checks.yml
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run validate
